name: Rust build

"on":
  push:
    paths:
      - "rust/**"
      - "assets/**"
      - "src/template.tex"
      - "src/font_filter.lua"
      - "scripts/windows/installer/**"
      - "LICENSE"
      - ".github/workflows/rust-build.yml"
  pull_request:
    paths:
      - "rust/**"
      - "assets/**"
      - "src/template.tex"
      - "src/font_filter.lua"
      - "scripts/windows/installer/**"
      - "LICENSE"
      - ".github/workflows/rust-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/scripts/windows/Build-Installer.ps1
      - name: Build Linux distribution tarball
        if: runner.os == 'Linux'
        run: bash rust/scripts/linux/Build-Tarball.sh
